<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1720"><title>北海道アキアジ情報DB</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><small>HOKKAIDO SALMON DB</small><h1>北海道アキアジ情報DB</h1></div><b>2026</b></header><main>
<section id="summary" class="page active"><h2>今日の要約</h2><div class="hero"><small>暫定トップ</small><h3>登別〜室蘭・チマイベツ</h3><p>日次判断をここに表示。Google Sheet連携は次段階で追加します。</p></div><div id="summaryCards"></div></section>
<section id="search" class="page"><h2>釣果検索</h2><div class="filters">
<label>エリア<select id="area"></select></label><label>釣果<select id="caught"><option value="all">すべて</option><option value="yes">釣果あり</option><option value="no">0本</option></select></label>
<label>信頼度<select id="trust"><option value="all">すべて</option><option>A</option><option>B</option><option>C</option></select></label>
<label>時間帯<select id="time"><option value="all">すべて</option><option>朝</option><option>昼</option><option>夕</option><option>夜</option></select></label>
<label>並び順<select id="sort"><option value="new">新しい順</option><option value="catch">釣果数順</option><option value="trust">信頼度順</option></select></label></div>
<div class="bar"><strong id="count"></strong><button id="reset">条件クリア</button></div><div id="cards"></div></section>
<section id="map" class="page"><h2>マップ</h2><div class="empty">🗺️ エリアマスタに緯度・経度を入れたら追加</div></section>
<section id="analysis" class="page"><h2>過去分析</h2><div id="analysisBox" class="hero"></div></section></main>
<nav><button data-page="summary" class="active">☀️<span>今日の要約</span></button><button data-page="search">🎣<span>釣果検索</span></button><button data-page="map">🗺️<span>マップ</span></button><button data-page="analysis">📊<span>過去分析</span></button></nav><script src="app.js"></script></body></html>
